<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg1:#EAF4FA;--bg2:#D7EAF5;--ink:#14384E;--mauve:#4F6E80;--cocoa:#1D4C93;--sky:#89CDE7;--card:rgba(255,255,255,.62);--line:rgba(20,56,78,.14);--blush:rgba(137,205,231,.22);--rose:#89CDE7;--ok-bg:#DDF1E4;--ok:#1E5A36;--warn-bg:#FCEBC8;--warn:#7A4E12;--bad-bg:#F8D7DA;--bad:#8A2C3A}
[data-theme=dark]{--bg1:#0B1E2A;--bg2:#14384E;--ink:#E6F2F8;--mauve:#9BB8C8;--card:rgba(20,56,78,.55);--line:rgba(137,205,231,.18);--blush:rgba(137,205,231,.12);--cocoa:#89CDE7;--ok-bg:rgba(46,160,90,.2);--ok:#8FE0AE;--warn-bg:rgba(230,160,40,.2);--warn:#F5C97A;--bad-bg:rgba(220,80,90,.2);--bad:#F5A3AC}
*{box-sizing:border-box}body{margin:0;font-family:Inter,'Segoe UI',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;min-height:100vh}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 48px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.topbar .brand{font-weight:700;letter-spacing:.08em;font-size:13px;color:var(--mauve)}
.hero{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:22px 24px;box-shadow:0 8px 30px rgba(10,30,45,.08)}

h1{color:var(--ink);font-size:clamp(24px,4vw,34px);margin:10px 0 6px;font-weight:700}.hero p{margin:0;max-width:720px;color:var(--mauve)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 6px 24px rgba(10,30,45,.06)}

label{font-size:13px;font-weight:600;color:var(--mauve);display:block;margin:10px 0 4px}
select,textarea,input{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:rgba(255,255,255,.7);color:#14384E}[data-theme=dark] select,[data-theme=dark] textarea,[data-theme=dark] input{background:rgba(255,255,255,.08);color:var(--ink)}
input[type=range],input[type=checkbox]{accent-color:#1D4C93}textarea{min-height:120px;resize:vertical}
button{background:#1D4C93;color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;margin-top:12px}button:hover{filter:brightness(1.1)}
button.ghost{background:transparent;color:var(--cocoa);border:1px solid var(--line)}

ul{padding-left:18px;margin:6px 0}li{margin:4px 0}li::marker{color:var(--sky)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}th{color:var(--mauve);font-weight:600}
.kpi{display:flex;gap:10px;flex-wrap:wrap}.kpi div{flex:1;min-width:120px;background:var(--blush);border:1px solid var(--line);border-radius:12px;padding:12px}.kpi b{display:block;font-size:24px;color:var(--cocoa)}
pre{background:#0B1E2A;color:#CFE8F4;border-radius:10px;padding:12px;font-size:12px;overflow:auto;max-height:320px}
footer{text-align:center;font-size:12px;color:var(--mauve);margin-top:28px}a{color:var(--cocoa)}.muted{color:var(--mauve);font-size:13px}
.hero:after{display:none}
</style><style>
.shell{display:grid;grid-template-columns:220px 1fr;gap:16px;margin-top:4px}@media(max-width:820px){.shell{grid-template-columns:1fr}}

.Vacation{background:#1D4C93}.Sick{background:#C27C0E}.Personal{background:#2E8B57}.Protected{background:#6B7A86}.Holiday{background:#89CDE7;color:#14384E}.pending{opacity:.6;border:1px dashed #fff}
.toast{position:fixed;right:18px;bottom:18px;background:var(--cocoa);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transform:translateY(10px);transition:.25s;z-index:9;max-width:340px}.toast.show{opacity:1;transform:none}
.modal{position:fixed;inset:0;background:rgba(10,30,45,.45);display:none;align-items:center;justify-content:center;z-index:8;padding:16px}.modal.show{display:flex}.modal .card{max-width:480px;width:100%;background:var(--bg1)}
.row{display:flex;gap:10px}.row>*{flex:1}.legend span{margin-right:10px;font-size:12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.bar{background:var(--blush);border-radius:99px;height:8px;margin-top:4px}.bar div{height:8px;border-radius:99px;background:var(--cocoa)}
</style><style></style></head><body><div class="wrap">
<div class="topbar"><span class="brand">QA PIPELINE · DEMO</span><span><button class="ghost" style="margin:0;padding:6px 12px" onclick="resetAll()">↺ Reset demo data</button> <button class="ghost" id="themeBtn" style="margin:0;padding:6px 12px" onclick="toggleTheme()">🌙 Dark</button></span></div>

<div class="modal" id="modal" onclick="if(event.target==this)closeM()"><div class="card" id="mbody"></div></div><div class="toast" id="toast"></div>

<script>
const STAGES=["Validate","Enrich","QA review","Hand off","Done"];const PLATS=["Meta","TikTok","YouTube"];
function SEED(){let id=100;const c=(title,stage,plat,dur,asset,extra={})=>({id:"QA-"+(id++),title,stage,plat,dur,asset,owner:"Coordinator A",created:Date.now()-Math.random()*864e5*3,...extra});
 return{user:"Coordinator A",nid:110,cb:{state:"CLOSED",fails:0,opened:null,threshold:3},down:false,par:{m:41,x:1,log:[]},
 cards:[c("Holiday offer · 30s","QA review","Meta",30,"https://drive.example.com/f/a1"),c("UGC remix v2","Enrich","TikTok",15,"https://drive.example.com/f/a2"),c("Founder story","Hand off","YouTube",60,"https://drive.example.com/f/a3"),c("Webinar teaser","Done","Meta",20,"https://drive.example.com/f/a4"),
  c("Spring hook test","Parked","",45,"",{errs:["asset link missing","platform blank"]}),c("Long-form demo","Parked","YouTube",240,"https://drive.example.com/f/a6",{errs:["duration out of range"]})],
 checklist:{parity:false,backfill:false,alerts:true,rollback:false,legacyOff:false},log:[]}}
const P=(c,t)=>`<span class="pill ${c}">${t}</span>`;
function validate(c){const e=[];if(!/^https:\/\/\S+\.\S+/.test(c.asset||""))e.push("asset link missing");if(!(c.dur>0&&c.dur<=180))e.push("duration out of range");if(!PLATS.includes(c.plat))e.push("platform blank");if(!c.title||c.title.length<3)e.push("title too short");return e}
function callApi(c){if(S.cb.state=="OPEN"){L(`⏸ ${c.id} held · circuit OPEN`);return false}
 if(S.down){S.cb.fails++;L(`❌ ${c.id} hand-off failed (${S.cb.fails}/${S.cb.threshold})`);if(S.cb.fails>=S.cb.threshold){S.cb.state="OPEN";S.cb.opened=Date.now();L(`🚨 Circuit breaker OPEN after ${S.cb.threshold} failures · alert sent`)}return false}
 S.cb.fails=0;return true}
function shadow(c){const legacy=c.plat=="Meta"?"QA-Meta":"QA-General",ours=c.plat=="Meta"?"QA-Meta":"QA-General";const ok=Math.random()>.03&&legacy==ours;ok?S.par.m++:S.par.x++;S.par.log.unshift({id:c.id,legacy,ours:ok?ours:"QA-Escalations",ok});if(S.par.log.length>50)S.par.log.length=50}
function advance(c){const errs=validate(c);if(errs.length){c.stage="Parked";c.errs=errs;L(`🅿️ ${c.id} parked: ${errs.join(", ")} · owner alerted`);return}
 c.errs=[];const i=STAGES.indexOf(c.stage);if(c.stage=="Parked"){c.stage="Validate";return advance(c)}
 if(c.stage=="Hand off"){if(!callApi(c))return;}
 if(i<STAGES.length-1){c.stage=STAGES[i+1];if(c.stage=="QA review")shadow(c);L(`➡️ ${c.id} → ${c.stage}`)}}
function card(id){return S.cards.find(c=>c.id==id)}
const V={};
V.overview=()=>{const by=s=>S.cards.filter(c=>c.stage==s).length,tot=S.par.m+S.par.x;return`<div class="hero"><span class="tag">QA PIPELINE</span><h1>Pipeline overview</h1><p>Cards move through Validate → Enrich → QA review → Hand off. Bad data is parked, never dropped.</p></div>
<div class="card" style="margin-top:16px"><div class="kpi"><div><b>${S.cards.length}</b>cards</div><div><b>${by("Parked")}</b>parked</div><div><b>${by("Done")}</b>handed off</div><div><b>${tot?Math.round(S.par.m/tot*100):100}%</b>shadow parity</div><div><b style="color:${S.cb.state=="OPEN"?"#C0392B":"inherit"}">${S.cb.state}</b>circuit breaker</div></div></div>
<div class="grid"><div class="card"><h2>Stage throughput</h2>${["Parked",...STAGES].map(s=>{const n=by(s);return`<div style="margin:6px 0">${s} <span class="muted">${n}</span><div class="bar"><div style="width:${n/Math.max(S.cards.length,1)*100}%;${s=="Parked"?"background:#C27C0E":""}"></div></div></div>`}).join("")}</div>
<div class="card"><h2>Quick actions</h2><button onclick="go('submit')">➕ Submit card</button> <button class="ghost" onclick="go('board')">Open board</button> <button class="ghost" onclick="go('parked')">Fix parked (${by("Parked")})</button><h2 style="margin-top:14px">Recent</h2>${S.log.slice(0,5).map(l=>`<div class="muted">${l.t} · ${esc(l.m)}</div>`).join("")}</div></div>`};
V.submit=()=>`<div class="grid"><div class="card"><h2>Submit a card</h2><label>Title</label><input id="fT" value="New hook test"><label>Asset link</label><input id="fA" value="https://drive.example.com/f/new"><div class="row"><div><label>Duration (s)</label><input id="fD" type="number" value="30"></div><div><label>Platform</label><select id="fP"><option value="">— choose —</option>${PLATS.map(p=>`<option>${p}</option>`).join("")}</select></div></div>
<button onclick="submitCard()">SUBMIT TO PIPELINE</button> <button class="ghost" onclick="submitRandom(5)">SUBMIT 5 RANDOM</button></div>
<div class="card"><h2>Validation rules</h2><ul><li>Asset link must be a full https URL</li><li>Duration between 1 and 180 seconds</li><li>Platform must be ${PLATS.join(", ")}</li><li>Title at least 3 characters</li></ul><p class="muted">Cards that fail are parked with reasons and the owner is alerted, so nothing is silently dropped.</p></div></div>`;
function submitCard(){const c={id:"QA-"+(S.nid++),title:$("fT").value.trim(),asset:$("fA").value.trim(),dur:+$("fD").value,plat:$("fP").value,stage:"Validate",owner:S.user,created:Date.now()};S.cards.unshift(c);L(`📥 ${c.id} submitted by ${S.user}`);advance(c);toast(c.stage=="Parked"?"🅿️ Parked: "+c.errs.join(", "):"✅ Passed validation → "+c.stage);go("board")}
function submitRandom(n){for(let i=0;i<n;i++){const c={id:"QA-"+(S.nid++),title:"Card "+S.nid,asset:Math.random()<.8?"https://drive.example.com/f/"+S.nid:"",dur:[15,30,45,0,60,200][Math.floor(Math.random()*6)],plat:Math.random()<.8?PLATS[Math.floor(Math.random()*3)]:"",stage:"Validate",owner:"Auto",created:Date.now()};S.cards.unshift(c);advance(c)}toast(n+" cards submitted");route()}
V.board=()=>`<div class="card"><h2>Pipeline board</h2><p class="muted">Drag a card to another column, or use ▶ to run its next stage.</p><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;overflow:auto">${STAGES.map(s=>`<div ondragover="event.preventDefault()" ondrop="dropTo('${s}',event)" style="background:var(--blush);border-radius:12px;padding:8px;min-height:240px;min-width:150px"><b style="font-size:12px;letter-spacing:.08em">${s.toUpperCase()}</b> <span class="muted">${S.cards.filter(c=>c.stage==s).length}</span>
${S.cards.filter(c=>c.stage==s).map(c=>`<div draggable="true" ondragstart="event.dataTransfer.setData('id','${c.id}')" style="background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:6px;font-size:13px"><b>${c.id}</b><br>${esc(c.title)}<br><span class="muted">${c.plat||"—"} · ${c.dur}s</span>${s!="Done"?`<br><button class="ghost" style="margin:4px 0 0;padding:3px 10px" onclick="advance(card('${c.id}'));route()">▶ Next</button>`:""}</div>`).join("")}</div>`).join("")}</div></div>`;
function dropTo(s,ev){const c=card(ev.dataTransfer.getData("id"));if(!c)return;if(STAGES.indexOf(s)>STAGES.indexOf(c.stage)+1){toast("⛔ Stages can't be skipped");return}if(s=="Hand off"||STAGES.indexOf(s)>STAGES.indexOf(c.stage)){advance(c)}else{c.stage=s;L(`↩️ ${c.id} moved back to ${s}`)}route()}
V.parked=()=>{const ps=S.cards.filter(c=>c.stage=="Parked");return`<div class="card"><h2>Parked cards (${ps.length})</h2>${ps.length?ps.map(c=>`<div style="border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0"><b>${c.id}</b> ${esc(c.title)} ${(c.errs||[]).map(e=>P("high",e)).join("")}<div class="row" style="margin-top:6px"><input id="a_${c.id}" value="${esc(c.asset)}" placeholder="Asset link"><input id="d_${c.id}" type="number" value="${c.dur}" style="max-width:100px"><select id="p_${c.id}"><option value="">— platform —</option>${PLATS.map(p=>`<option ${p==c.plat?"selected":""}>${p}</option>`).join("")}</select></div><button onclick="fixCard('${c.id}')">Fix & resubmit</button></div>`).join(""):"<p class='muted'>🎉 Nothing parked.</p>"}</div>`};
function fixCard(id){const c=card(id);c.asset=$("a_"+id).value.trim();c.dur=+$("d_"+id).value;c.plat=$("p_"+id).value;advance(c);toast(c.stage=="Parked"?"Still invalid: "+c.errs.join(", "):"✅ Resubmitted → "+c.stage);L(`🛠 ${id} fixed by ${S.user}`);route()}
V.health=()=>`<div class="grid"><div class="card"><h2>Circuit breaker</h2><p style="font-size:20px">${P(S.cb.state=="OPEN"?"high":"low",S.cb.state=="OPEN"?"OPEN · calls paused":"CLOSED · healthy")}</p><p class="muted">Consecutive failures: ${S.cb.fails}/${S.cb.threshold}${S.cb.opened?` · opened ${new Date(S.cb.opened).toLocaleTimeString()}`:""}</p>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto" ${S.down?"checked":""} onchange="S.down=this.checked;L(this.checked?'🔌 Downstream API outage simulated':'🔌 Downstream API restored');route()"> Simulate downstream API outage</label>
<label>Failure threshold</label><input type="number" min="1" max="10" value="${S.cb.threshold}" onchange="S.cb.threshold=Math.max(1,Math.min(10,+this.value));route()">
<button onclick="healthCheck()">RUN HEALTH CHECK</button></div>
<div class="card"><h2>Held at hand-off</h2>${S.cards.filter(c=>c.stage=="Hand off").map(c=>`<div>${c.id} · ${esc(c.title)}</div>`).join("")||"<p class='muted'>None.</p>"}<button class="ghost" onclick="S.cards.filter(c=>c.stage=='Hand off').forEach(advance);route()">Retry all hand-offs</button></div></div>`;
function healthCheck(){if(S.down){toast("❌ Health check failed · circuit stays OPEN");L("🩺 Health check failed");return route()}S.cb={...S.cb,state:"CLOSED",fails:0,opened:null};L("🩺 Health check passed · circuit CLOSED");toast("✅ Circuit closed");route()}
V.parity=()=>{const tot=S.par.m+S.par.x,pct=tot?S.par.m/tot*100:100,ck=S.checklist;ck.parity=pct>=98&&tot>=30;const items=[["parity","Shadow parity ≥ 98% over 30+ cards (auto)"],["backfill","Historical cards backfilled"],["alerts","Alerts routed to coordinators"],["rollback","Rollback plan documented"],["legacyOff","Legacy workflow scheduled OFF the same minute (single-writer rule)"]];const ready=items.every(([k])=>ck[k]);
return`<div class="grid"><div class="card"><h2>Shadow parity report</h2><div class="kpi"><div><b>${pct.toFixed(1)}%</b>parity</div><div><b>${S.par.m}</b>matches</div><div><b>${S.par.x}</b>diffs</div></div><table style="margin-top:10px"><tr><th>Card</th><th>Legacy</th><th>New</th><th></th></tr>${S.par.log.slice(0,10).map(r=>`<tr><td>${r.id}</td><td>${r.legacy}</td><td>${r.ours}</td><td>${r.ok?"✅":"❌"}</td></tr>`).join("")}</table></div>
<div class="card"><h2>Cutover readiness</h2>${items.map(([k,l])=>`<label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" style="width:auto" ${ck[k]?"checked":""} ${k=="parity"?"disabled":""} onchange="S.checklist['${k}']=this.checked;route()"> ${l}</label>`).join("")}
<p style="margin-top:12px">${P(ready?"low":"medium",ready?"READY TO CUT OVER":"NOT READY")}</p><button ${ready?"":"disabled style='opacity:.5'"} onclick="L('🚀 Cutover executed: new pipeline LIVE, legacy OFF');toast('Cutover complete');route()">EXECUTE CUTOVER</button></div></div>`};
V.logs=()=>`<div class="card"><h2>Pipeline log</h2>${S.log.map(l=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="muted">${l.t}</span> · ${esc(l.m)}</div>`).join("")||"<p class='muted'>No log entries.</p>"}</div>`;
function badge(r){return r=="parked"?S.cards.filter(c=>c.stage=="Parked").length||"":r=="health"&&S.cb.state=="OPEN"?"!":""}


const $=i=>document.getElementById(i);const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const KEY="qaprDemo";let S;try{S=JSON.parse(localStorage.getItem(KEY))||SEED()}catch(e){S=SEED()}if(!S.log)S.log=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function toast(m){const t=$("toast");t.innerHTML=m;t.classList.add("show");clearTimeout(t._);t._=setTimeout(()=>t.classList.remove("show"),3000)}
function L(m){S.log.unshift({t:new Date().toLocaleString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}),m});if(S.log.length>200)S.log.length=200}
function openM(h){$("mbody").innerHTML=h;$("modal").classList.add("show")}function closeM(){$("modal").classList.remove("show")}
function go(r){location.hash="#/"+r}
function route(){const r=(location.hash.replace("#/","").split("?")[0]||Object.keys(V)[0]);document.querySelectorAll(".side a").forEach(a=>a.classList.toggle("on",a.dataset.r==r));
